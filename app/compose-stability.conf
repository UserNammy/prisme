// Compose stability configuration.
//
// The UI state is built from fresh, never-mutated Kotlin collections (StateFlow + copy()),
// so read-only collection interfaces can be treated as stable. Without this, every
// composable taking a List/Map (rails, progress maps, EPG maps) is "unstable" and is
// re-executed on every state emission even when its inputs did not change.
kotlin.collections.List
kotlin.collections.Map
kotlin.collections.Set
kotlin.collections.Collection
